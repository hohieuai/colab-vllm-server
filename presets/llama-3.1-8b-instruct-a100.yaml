# Llama 3.1 8B Instruct on a Colab A100 40 GB, configured for the highest
# output quality:
#   - BF16 weights, the full precision of the checkpoint.
#   - BF16 KV cache, and the native 131,072-token context.
#
# Gated model: accept the license on Hugging Face and set HF_TOKEN in
# .env.local before `serve up`.
recipe: meta-llama/Llama-3.1-8B-Instruct
variant: default
gpu: A100

overrides:
  --kv-cache-dtype: bfloat16

frontend: python
