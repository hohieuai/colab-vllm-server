name: Documentation
description: Report a wrong, missing, or unclear part of the documentation
title: "[Docs] "
labels:
  - documentation
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The link to the page or the file path.
      placeholder: docs/quickstart.md
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong, missing, or unclear. If a step did not work, paste the command and its output.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: The text or fix you would expect.
