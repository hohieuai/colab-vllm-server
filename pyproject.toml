[project]
name = "colab-vllm-server"
version = "0.1.0"
description = "Run an OpenAI-compatible vLLM endpoint on a Google Colab GPU, configured from vLLM Recipes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["pyyaml>=6", "openai>=1.40"]
keywords = ["vllm", "colab", "openai", "inference", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/hohieuai/colab-vllm-server"
Documentation = "https://github.com/hohieuai/colab-vllm-server/tree/main/docs"
Issues = "https://github.com/hohieuai/colab-vllm-server/issues"
Changelog = "https://github.com/hohieuai/colab-vllm-server/blob/main/CHANGELOG.md"

[project.scripts]
serve = "colab_vllm_server.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colab_vllm_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["runs", "cache"]
